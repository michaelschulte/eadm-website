meta:
  name: EADM
  link: https://eadm.eu

color:
  palette:
    eadm-blue: "#1f4e79"
    eadm-slate: "#33424f"
    eadm-gray: "#5a6570"
  primary: eadm-blue
  secondary: eadm-slate
  foreground: eadm-gray
  background: "#ffffff"

typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 500, 600, 700]
    - family: "Source Serif 4"
      source: google
      weight: [400, 600]
  base:
    family: Inter
    size: 1rem
    line-height: 1.6
  headings:
    family: "Source Serif 4"
    weight: 600
    line-height: 1.25
  link:
    color: primary
    weight: 500
