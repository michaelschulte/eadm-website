name: Publish site to GitHub Pages

# Renders the Quarto site and deploys it to
# https://michaelschulte.github.io/eadm-website/ on every push to main.
# It deploys a Pages artifact rather than committing the ~450MB built site
# to a gh-pages branch, so the repository doesn't grow with each deploy.
#
# Before rendering, it turns newly uploaded newsletter PDFs
# (files/YYYY/MM/EADM-Newsletter-YYYY-MM.pdf) into an archive entry, a
# cover image and a News post (.github/scripts/add_newsletters.py) and
# commits those back to main. The post text comes from the Claude API and
# needs the ANTHROPIC_API_KEY repository secret; without it the post gets
# a short generic text. A commit pushed with the workflow's own token
# does not start another run, so this cannot loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish; a newer push queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level permissions replace the top-level ones for this job:
    # it needs to push the generated newsletter files back to main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Look for new newsletter PDFs
        id: newsletters
        run: |
          pending=$(python3 .github/scripts/add_newsletters.py --list)
          echo "$pending"
          if [ -n "$pending" ]; then echo "pending=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v6
        if: steps.newsletters.outputs.pending == 'true'
        with:
          python-version: "3.13"

      - name: Add newsletter posts, archive entries and covers
        if: steps.newsletters.outputs.pending == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet anthropic
          python3 .github/scripts/add_newsletters.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter/index.qmd news/posts images
          git commit -m "Newsletter: add the archive entry, cover and News post for new issues"
          git pull --rebase
          git push

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned to the version the site is developed with locally.
          version: 1.9.37

      # The preview profile (_quarto-preview.yml) adds a noindex tag so the
      # preview stays out of search results while eadm.eu runs WordPress.
      - name: Render site
        run: quarto render --profile preview

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
